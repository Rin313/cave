<!doctype html>
<html>
<meta charset="utf-8">
<title>Settings</title>
<style>
	:root {
		color-scheme: light dark;
		--paper: #f5f0e1;
		--surface: #fffdf5;
		--ink: #141414;
		--dim: #6f6a5c;
		--chip: #ece7d6;
		--wash: #dff7ff;
		--amber: #ffd43b;
		--pink: #ff9ed2;
		--cyan: #7ae7ff;
		--danger: #ffa8a8;
		--shadow: #141414;
		--dots: #14141418;
		--rule: #1414142e;
		--pop: 10px;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--paper: #1a1a1a;
			--surface: #242424;
			--ink: #d6cfbc;
			--dim: #a29b89;
			--chip: #33302a;
			--wash: #16323a;
			--amber: #eecf45;
			--pink: #e483b9;
			--cyan: #66c6e3;
			--danger: #d96a6a;
			--shadow: #d6cfbc;
			--dots: #d6cfbc1c;
			--rule: #d6cfbc36;
			--pop: 8px;
		}
	}
	::selection { background: var(--amber); color: #141414; }
	h1:empty, p:empty, button:empty { display: none; }
	body { margin: 0; background: var(--paper); background-image: radial-gradient(var(--dots) 1.6px, transparent 1.6px); background-size: 18px 18px; color: var(--ink); font: 14px/1.6 "Segoe UI", system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif; }
	main { box-sizing: border-box; max-width: 640px; margin: 34px auto 52px; padding: 24px 28px 28px; background: var(--surface); border: 3px solid var(--ink); box-shadow: var(--pop) var(--pop) 0 var(--shadow); counter-reset: section; }
	header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
	h1 { margin: 2px 0 0 3px; padding: 3px 12px 4px; font-size: 21px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; background: var(--amber); color: #141414; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--shadow); transform: rotate(-1.5deg); }
	h2 { display: inline-block; margin: 30px 0 10px; padding: 3px 11px 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--shadow); }
	h2::before { counter-increment: section; content: counter(section, decimal-leading-zero) "· "; opacity: 0.6; }
	p { margin: 8px 0; }
	ul { list-style: none; margin: 0; padding: 0; }
	li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 2px dotted var(--rule); }
	li:last-child { border-bottom: none; }
	.name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
	.tag { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; background: var(--chip); border: 2px solid var(--ink); padding: 2px 7px; }
	.err { padding: 9px 11px; background: var(--danger); color: #141414; border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--shadow); white-space: pre-wrap; overflow-wrap: anywhere; }
	.muted { color: var(--dim); }
	.row { display: flex; gap: 8px; margin: 12px 0; }
	.row input { flex: 1; min-width: 0; }
	button, input { box-sizing: border-box; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--ink); border-radius: 0; padding: 6px 12px; box-shadow: 3px 3px 0 var(--shadow); }
	button { font-weight: 700; cursor: pointer; transition: transform 80ms ease, box-shadow 80ms ease, background-color 120ms ease; }
	button:hover { background: var(--amber); color: #141414; transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
	button:active { transform: translate(3px, 3px); box-shadow: none; }
	input::placeholder { color: var(--dim); }
	input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
	#close { background: var(--pink); color: #141414; }
	#close:hover { background: var(--amber); }
	#current { width: fit-content; max-width: 100%; padding: 4px 10px 5px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; background: var(--chip); border: 2px solid var(--ink); }
	#thinking:not([hidden]) { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; }
	#thinking button { padding: 3px 9px; font-size: 12px; box-shadow: 2px 2px 0 var(--shadow); }
	#thinking button.on { background: var(--amber); color: #141414; }
	#flow { margin: 14px 0; padding: 14px; background: var(--wash); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--shadow); }
	#flow a { display: inline-block; margin: 2px 8px 2px 0; padding: 2px 9px; font-weight: 700; color: #141414; text-decoration: none; background: var(--cyan); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--shadow); }
	#flow a:hover { background: var(--amber); }
	#promptArea > button { margin: 2px 8px 2px 0; }
	footer { margin-top: 34px; padding-top: 12px; border-top: 3px solid var(--ink); }
	#advanced { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
	::-webkit-scrollbar { width: 12px; height: 12px; }
	::-webkit-scrollbar-track { background: var(--paper); border-left: 2px solid var(--ink); }
	::-webkit-scrollbar-thumb { background: var(--ink); border: 3px solid var(--paper); }
	::-webkit-scrollbar-corner { background: var(--paper); }
	@supports not selector(::-webkit-scrollbar) {
		:root { scrollbar-width: thin; scrollbar-color: var(--ink) var(--paper); }
	}
	@media (max-width: 560px) {
		main { margin: 18px 14px 34px; padding: 20px; }
	}
	@media (prefers-reduced-motion: reduce) {
		button { transition: none; }
		button:hover, button:active { transform: none; }
	}
</style>
<main>
	<header>
		<h1 id="title"></h1>
		<button id="close" type="button"></button>
	</header>
	<p id="boot" class="err" hidden></p>
	<section id="uiSection" hidden>
		<h2 id="uiTitle"></h2>
		<ul id="uiList"></ul>
		<p id="uiNone" class="muted" hidden></p>
	</section>
	<section>
		<h2 id="modelTitle"></h2>
		<p id="current"></p>
		<p id="currentError" class="err" hidden></p>
		<div id="thinking" hidden><span id="thinkingLabel" class="tag"></span></div>
		<div id="providers"></div>
		<div id="flow" hidden>
			<div id="notices"></div>
			<div id="promptArea"></div>
		</div>
		<div id="models">
			<div class="row">
				<input id="search" type="search">
				<button id="all" type="button"></button>
			</div>
			<ul id="modelList"></ul>
		</div>
	</section>
	<footer><p id="advanced" class="muted"></p><div class="row"><button id="openRoot" type="button"></button><button id="openGames" type="button"></button></div></footer>
</main>
<script>
(() => {
"use strict";
const shell = window.shell;
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text !== undefined) n.textContent = text; if (cls !== undefined) n.className = cls; return n; };
const button = (label, onClick) => { const b = el("button", label); b.type = "button"; b.onclick = onClick; return b; };
const link = (url, label) => { const a = el("a", label); a.href = url; a.target = "_blank"; a.rel = "noreferrer"; return a; };
const reason = (e) => String(e?.message ?? e);

const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
const text = {
	"title": ["配置", "Settings"],
	"close": ["完成", "Done"],
	"bridge": ["window.shell 不可用", "window.shell unavailable"],
	"boot": ["界面未能自动解析：{error}", "Could not resolve a user interface: {error}"],
	"advanced": ["高级：直接编辑 {dir} 下的 settings.json 与 auth.json（与 CLI 共用）。", "Advanced: edit settings.json and auth.json under {dir} directly (shared with the CLI)."],
	"open.root": ["打开根目录", "Open root folder"],
	"open.games": ["打开 games 目录", "Open games folder"],
	"current": ["当前", "Current"],
	"use": ["使用", "Use"],
	"thinking.label": ["思考档", "Thinking"],
	"thinking.default": ["默认", "Default"],
	"thinking.hint": ["默认即 SDK 缺省档；超出模型能力的档位自动收敛。", "Default uses the SDK default level; levels beyond model capability clamp automatically."],
	"configured": ["已配置", "Configured"],
	"unconfigured": ["未配置", "Not configured"],
	"ui.section": ["界面", "Interface"],
	"ui.scope": ["（{game}）", " ({game})"],
	"ui.none": ["没有可用界面：在 games/<id>/ui/index.html（缺省）或 games/<id>/ui/<name>/index.html 放置界面。", "No user interface available: add games/<id>/ui/index.html (default) or games/<id>/ui/<name>/index.html."],
	"model.section": ["模型与凭据", "Models & credentials"],
	"model.current": ["当前模型：{model}", "Current model: {model}"],
	"model.error": ["模型不可用：{error}", "Model unavailable: {error}"],
	"model.loading": ["加载…", "Loading…"],
	"model.noCredentials": ["未配置凭据", "No credentials"],
	"model.logout": ["退出登录", "Sign out"],
	"model.apiKey": ["使用 API key", "Use API key"],
	"model.login": ["登录", "Sign in"],
	"model.filter": ["筛选", "Filter"],
	"model.all": ["显示全部", "Show all"],
	"model.available": ["仅显示可用", "Available only"],
	"model.empty": ["没有匹配的模型", "No matching models"],
	"login.waiting": ["等待登录…", "Waiting for sign-in…"],
	"login.ok": ["确定", "OK"],
	"login.done": ["已完成。", "Done."],
	"login.failed": ["登录失败：{error}", "Sign-in failed: {error}"],
	"login.link": ["打开授权链接", "Open authorization link"],
	"login.device": ["在 {uri} 输入代码 {code}", "Enter code {code} at {uri}"],
};
const t = (key, args) => (text[key]?.[zh ? 0 : 1] ?? key).replace(/\{(\w+)\}/g, (match, name) => args?.[name] ?? match);
document.documentElement.lang = zh ? "zh" : "en";

(async () => {
	if (!shell) {
		$("boot").hidden = false;
		$("boot").textContent = t("bridge");
		return;
	}
	const params = new URLSearchParams(location.search);
	const env = await shell.env();
	let settings = await shell.settings();
	let allModels = [];
	let showAll = false;
	let face = null;
	let busy = false;

	document.title = t("title");
	$("title").textContent = t("title");
	$("close").textContent = t("close");
	$("close").onclick = () => window.close();
	$("openRoot").textContent = t("open.root");
	$("openRoot").onclick = () => shell.reveal();
	$("openGames").textContent = t("open.games");
	$("openGames").onclick = () => shell.reveal("games");
	$("modelTitle").textContent = t("model.section");
	$("advanced").textContent = t("advanced", { dir: env.root });
	$("thinkingLabel").textContent = t("thinking.label");
	$("thinking").title = t("thinking.hint");
	$("search").placeholder = t("model.filter");
	$("all").textContent = t("model.all");
	$("search").oninput = drawModels;
	$("all").onclick = () => {
		showAll = !showAll;
		$("all").textContent = showAll ? t("model.available") : t("model.all");
		drawModels();
	};

	if (params.get("boot") === "1") {
		$("boot").hidden = false;
		$("boot").textContent = t("boot", { error: params.get("error") ?? "" });
		$("uiSection").hidden = false;
		$("uiTitle").textContent = t("ui.section");
		await renderUis();
	}
	await refreshCurrent();
	await renderProviders();
	await renderModels();

	function currentRef() {
		return typeof settings.model === "string" ? settings.model : "";
	}

	/** 解析在壳内完成（与 SDK 同一解析器）：UI 不猜后缀，只渲染解析面。 */
	async function currentFace() {
		try {
			return await shell.currentModel();
		} catch (e) {
			return { error: reason(e) };
		}
	}

	function renderThinking() {
		const row = $("thinking");
		const resolved = face !== null && face.error === undefined;
		const levels = resolved ? face.thinkingLevels : [];
		row.hidden = levels.length === 0;
		const buttons = [button(t("thinking.default"), () => void applyLevel(""))];
		buttons[0].dataset.level = "";
		for (const level of levels) {
			const b = button(level, () => void applyLevel(level));
			b.dataset.level = level;
			buttons.push(b);
		}
		row.replaceChildren($("thinkingLabel"), ...buttons);
		const current = resolved && face.level !== undefined ? face.level : "";
		for (const b of buttons) b.classList.toggle("on", b.dataset.level === current);
	}

	async function applyModel(model) {
		if (busy) return;
		busy = true;
		try {
			settings = await shell.setSettings({ model });
			await refreshCurrent();
			drawModels();
		} finally {
			busy = false;
		}
	}

	async function applyLevel(level) {
		if (face === null || face.error !== undefined) return;
		try {
			await applyModel(level === "" ? face.ref : `${face.ref}:${level}`);
		} catch (e) {
			alert(reason(e));
		}
	}

	async function refreshCurrent() {
		$("current").textContent = t("model.current", { model: currentRef() || t("unconfigured") });
		face = await currentFace();
		const error = face !== null && face.error !== undefined ? face.error : null;
		$("currentError").hidden = error === null;
		if (error !== null) $("currentError").textContent = t("model.error", { error });
		renderThinking();
	}

	async function renderUis() {
		const none = $("uiNone");
		none.textContent = t("ui.none");
		let uis;
		try {
			uis = await shell.uis();
		} catch (e) {
			none.hidden = false;
			none.textContent = reason(e);
			return;
		}
		none.hidden = uis.length > 0;
		$("uiList").replaceChildren(...uis.map((u) => {
			const scope = u.game !== u.name ? t("ui.scope", { game: u.game }) : "";
			const mark = u.ref === settings.ui ? ` · ${t("current")}` : "";
			const li = document.createElement("li");
			li.append(el("span", `${u.name}${scope}${mark}`, "name"), button(t("use"), async () => {
				try {
					await shell.use(u.ref);
				} catch (e) {
					none.hidden = false;
					none.className = "err";
					none.textContent = reason(e);
				}
			}));
			return li;
		}));
	}

	async function renderProviders() {
		const box = $("providers");
		box.replaceChildren(el("p", t("model.loading"), "muted"));
		let providers;
		try {
			providers = await shell.auth.providers();
		} catch (e) {
			box.replaceChildren(el("p", reason(e), "err"));
			return;
		}
		const list = document.createElement("ul");
		for (const p of providers) {
			const li = document.createElement("li");
			li.append(el("span", p.name, "name"), el("span", p.configured ? t("configured") : t("unconfigured"), "tag"));
			if (p.label) li.append(el("span", p.label, "tag"));
			if (p.apiKey?.login) li.append(button(t("model.apiKey"), () => void startLogin(p.id, "api_key")));
			if (p.oauth) li.append(button(p.oauth.label || t("model.login"), () => void startLogin(p.id, "oauth")));
			if (p.configured) li.append(button(t("model.logout"), async () => { await shell.auth.logout(p.id); await refreshProvidersAndModels(); }));
			list.append(li);
		}
		box.replaceChildren(list);
	}

	async function refreshProvidersAndModels() {
		settings = await shell.settings();
		await refreshCurrent();
		await renderProviders();
		await renderModels();
	}

	async function startLogin(provider, type) {
		$("flow").hidden = false;
		$("notices").replaceChildren();
		$("promptArea").replaceChildren(el("p", t("login.waiting"), "muted"));
		const offPrompt = shell.auth.onPrompt(({ prompt }) => renderPrompt(prompt));
		const offNotice = shell.auth.onNotice(({ notice }) => renderNotice(notice));
		try {
			await shell.auth.login(provider, type);
			$("promptArea").replaceChildren(el("p", t("login.done"), "muted"));
		} catch (e) {
			$("promptArea").replaceChildren(el("p", t("login.failed", { error: reason(e) }), "err"));
		} finally {
			offPrompt();
			offNotice();
			await refreshProvidersAndModels();
		}
	}

	function renderPrompt(prompt) {
		const area = $("promptArea");
		area.replaceChildren(el("p", prompt.message));
		if (prompt.type === "select") {
			for (const option of prompt.options ?? []) area.append(button(`${option.label}${option.description ? ` — ${option.description}` : ""}`, () => answer(option.id)));
			return;
		}
		const input = el("input");
		input.type = prompt.type === "secret" ? "password" : "text";
		input.placeholder = prompt.placeholder ?? "";
		input.addEventListener("keydown", (e) => { if (e.key === "Enter") answer(input.value); });
		const row = el("div", undefined, "row");
		row.append(input, button(t("login.ok"), () => answer(input.value)));
		area.append(row);
		input.focus();
	}

	function answer(value) {
		$("promptArea").replaceChildren(el("p", t("login.waiting"), "muted"));
		void shell.auth.answer(value).catch((e) => $("promptArea").replaceChildren(el("p", reason(e), "err")));
	}

	function renderNotice(notice) {
		const box = $("notices");
		if (notice.type === "info") {
			box.append(el("p", notice.message));
			for (const l of notice.links ?? []) box.append(link(l.url, l.label ?? l.url));
		} else if (notice.type === "auth_url") {
			box.append(link(notice.url, t("login.link")));
			if (notice.instructions) box.append(el("p", notice.instructions, "muted"));
		} else if (notice.type === "device_code") {
			box.append(el("p", t("login.device", { uri: notice.verificationUri, code: notice.userCode })));
		} else if (notice.type === "progress") {
			box.append(el("p", notice.message, "muted"));
		}
	}

	async function renderModels() {
		const list = $("modelList");
		list.replaceChildren(el("li", t("model.loading"), "muted"));
		try {
			allModels = await shell.models();
		} catch (e) {
			list.replaceChildren(el("li", reason(e), "err"));
			return;
		}
		drawModels();
	}

	function drawModels() {
		const query = $("search").value.trim().toLowerCase();
		const current = face !== null && face.error === undefined ? face.ref : "";
		const list = $("modelList");
		const rows = allModels.filter((m) => (showAll || m.available) && (query === "" || m.ref.toLowerCase().includes(query) || m.name.toLowerCase().includes(query)));
		list.replaceChildren();
		if (rows.length === 0) {
			list.append(el("li", t("model.empty"), "muted"));
			return;
		}
		for (const m of rows.slice(0, 200)) {
			const li = document.createElement("li");
			li.append(el("span", m.ref === current ? `${m.name} · ${t("current")}` : m.name, "name"));
			if (!m.available) li.append(el("span", t("model.noCredentials"), "tag"));
			li.append(button(t("use"), async () => {
				try {
					const keep = face?.level !== undefined && m.thinkingLevels.includes(face.level) ? `:${face.level}` : "";
					await applyModel(`${m.ref}${keep}`);
				} catch (e) {
					alert(reason(e));
				}
			}));
			list.append(li);
		}
	}
})();
})();
</script>
</html>
