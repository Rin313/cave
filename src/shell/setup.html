<!doctype html>
<html>
<meta charset="utf-8">
<title>cave</title>
<style>
	:root { color-scheme: light; }
	::selection { background: #ffe14f; }
	body { margin: 0; background: #f5f0e1; background-image: radial-gradient(#14141416 1.6px, transparent 1.6px); background-size: 18px 18px; color: #141414; font: 14px/1.55 "Segoe UI", system-ui, sans-serif; }
	main { box-sizing: border-box; max-width: 600px; margin: 26px auto; padding: 20px 22px 24px; background: #fffdf5; border: 3px solid #141414; box-shadow: 10px 10px 0 #141414; }
	header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
	h1 { font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin: 0; padding: 2px 10px; background: #ffe14f; border: 2px solid #141414; box-shadow: 4px 4px 0 #141414; }
	h2 { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin: 26px 0 8px; padding: 3px 10px; background: #141414; color: #f5f0e1; }
	p { margin: 6px 0; }
	ul { list-style: none; margin: 0; padding: 0; }
	li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 2px dotted #14141444; }
	li:last-child { border-bottom: none; }
	.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
	.tag { font-family: ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; background: #ece7d6; border: 2px solid #141414; padding: 0 6px; }
	.err { color: #141414; background: #ffa8a8; border: 2px solid #141414; box-shadow: 3px 3px 0 #141414; padding: 6px 8px; white-space: pre-wrap; }
	.muted { color: #6f6a5c; }
	.row { display: flex; gap: 8px; margin: 8px 0; }
	.row input { flex: 1; }
	button, input { font: inherit; color: inherit; background: #fffdf5; border: 2px solid #141414; border-radius: 0; padding: 6px 10px; box-shadow: 3px 3px 0 #141414; }
	button { font-weight: 700; cursor: pointer; }
	button:hover { background: #ffe14f; }
	button:active { transform: translate(3px, 3px); box-shadow: none; }
	input::placeholder { color: #8a8577; }
	input:focus-visible, button:focus-visible { outline: 3px solid #7ae7ff; outline-offset: 1px; }
	#close { background: #ff9ed2; }
	#close:hover { background: #ffe14f; }
	#flow { border: 3px solid #141414; background: #dff7ff; box-shadow: 6px 6px 0 #141414; padding: 12px; margin: 12px 0; }
	#flow a { display: inline-block; color: #141414; font-weight: 700; text-decoration: none; background: #7ae7ff; border: 2px solid #141414; box-shadow: 2px 2px 0 #141414; padding: 2px 8px; margin: 2px 0; }
	#flow a:hover { background: #ffe14f; }
	::-webkit-scrollbar { width: 12px; }
	::-webkit-scrollbar-track { background: #f5f0e1; border-left: 2px solid #141414; }
	::-webkit-scrollbar-thumb { background: #141414; border: 3px solid #f5f0e1; }
	footer { margin-top: 30px; border-top: 3px solid #141414; padding-top: 10px; }
</style>
<main>
	<header>
		<h1 id="title"></h1>
		<button id="close" type="button"></button>
	</header>
	<p id="boot" class="err" hidden></p>
	<section id="uiSection" hidden>
		<h2 id="uiTitle"></h2>
		<ul id="uiList"></ul>
		<p id="uiNone" class="muted" hidden></p>
	</section>
	<section>
		<h2 id="modelTitle"></h2>
		<p id="current"></p>
		<div id="providers"></div>
		<div id="flow" hidden>
			<div id="notices"></div>
			<div id="promptArea"></div>
		</div>
		<div id="models">
			<div class="row">
				<input id="search" type="search">
				<button id="all" type="button"></button>
			</div>
			<ul id="modelList"></ul>
		</div>
	</section>
	<footer><p id="advanced" class="muted"></p></footer>
</main>
<script>
(() => {
"use strict";
const cave = window.cave;
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text !== undefined) n.textContent = text; if (cls !== undefined) n.className = cls; return n; };
const button = (label, onClick) => { const b = el("button", label); b.type = "button"; b.onclick = onClick; return b; };
const link = (url, label) => { const a = el("a", label); a.href = url; a.target = "_blank"; a.rel = "noreferrer"; return a; };
const reason = (e) => String(e?.message ?? e);

const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
const text = {
	"title": ["配置", "Settings"],
	"close": ["完成", "Done"],
	"bridge": ["window.cave 不可用", "window.cave unavailable"],
	"boot": ["界面未能自动解析：{error}", "Could not resolve a user interface: {error}"],
	"advanced": ["高级：直接编辑 {dir} 下的 settings.json 与 auth.json（与 CLI 共用）。", "Advanced: edit settings.json and auth.json under {dir} directly (shared with the CLI)."],
	"current": ["当前", "Current"],
	"use": ["使用", "Use"],
	"configured": ["已配置", "Configured"],
	"unconfigured": ["未配置", "Not configured"],
	"ui.section": ["界面", "Interface"],
	"ui.scope": ["（{game}）", " ({game})"],
	"ui.none": ["没有可用界面：在数据根 ui/<name>/index.html 或 games/<id>/ui/<name>/index.html 放置界面。", "No user interface available: add ui/<name>/index.html or games/<id>/ui/<name>/index.html under the data root."],
	"model.section": ["模型与凭据", "Models & credentials"],
	"model.current": ["当前模型：{model}", "Current model: {model}"],
	"model.loading": ["加载…", "Loading…"],
	"model.noCredentials": ["未配置凭据", "No credentials"],
	"model.logout": ["退出登录", "Sign out"],
	"model.apiKey": ["使用 API key", "Use API key"],
	"model.login": ["登录", "Sign in"],
	"model.filter": ["筛选", "Filter"],
	"model.all": ["显示全部", "Show all"],
	"model.available": ["仅显示可用", "Available only"],
	"model.empty": ["没有匹配的模型", "No matching models"],
	"login.waiting": ["等待登录…", "Waiting for sign-in…"],
	"login.ok": ["确定", "OK"],
	"login.done": ["已完成。", "Done."],
	"login.failed": ["登录失败：{error}", "Sign-in failed: {error}"],
	"login.link": ["打开授权链接", "Open authorization link"],
	"login.device": ["在 {uri} 输入代码 {code}", "Enter code {code} at {uri}"],
};
const t = (key, args) => (text[key]?.[zh ? 0 : 1] ?? key).replace(/\{(\w+)\}/g, (match, name) => args?.[name] ?? match);
document.documentElement.lang = zh ? "zh" : "en";

(async () => {
	if (!cave) {
		$("boot").hidden = false;
		$("boot").textContent = t("bridge");
		return;
	}
	const params = new URLSearchParams(location.search);
	const env = await cave.env();
	let settings = await cave.settings();
	let allModels = [];
	let showAll = false;

	document.title = t("title");
	$("title").textContent = t("title");
	$("close").textContent = t("close");
	$("close").onclick = () => window.close();
	$("modelTitle").textContent = t("model.section");
	$("advanced").textContent = t("advanced", { dir: env.configDir });
	$("search").placeholder = t("model.filter");
	$("all").textContent = t("model.all");
	$("search").oninput = drawModels;
	$("all").onclick = () => {
		showAll = !showAll;
		$("all").textContent = showAll ? t("model.available") : t("model.all");
		drawModels();
	};

	if (params.get("boot") === "1") {
		$("boot").hidden = false;
		$("boot").textContent = t("boot", { error: params.get("error") ?? "" });
		$("uiSection").hidden = false;
		$("uiTitle").textContent = t("ui.section");
		await renderUis();
	}
	refreshCurrent();
	await renderProviders();
	await renderModels();

	function refreshCurrent() {
		$("current").textContent = t("model.current", { model: typeof settings.model === "string" ? settings.model : t("unconfigured") });
	}

	async function renderUis() {
		const none = $("uiNone");
		none.textContent = t("ui.none");
		let uis;
		try {
			uis = await cave.uis();
		} catch (e) {
			none.hidden = false;
			none.textContent = reason(e);
			return;
		}
		none.hidden = uis.length > 0;
		$("uiList").replaceChildren(...uis.map((u) => {
			const scope = u.game && u.game !== u.name ? t("ui.scope", { game: u.game }) : "";
			const mark = u.ref === settings.ui ? ` · ${t("current")}` : "";
			const li = document.createElement("li");
			li.append(el("span", `${u.name}${scope}${mark}`, "name"), button(t("use"), () => cave.use(u.ref)));
			return li;
		}));
	}

	async function renderProviders() {
		const box = $("providers");
		box.replaceChildren(el("p", t("model.loading"), "muted"));
		let providers;
		try {
			providers = await cave.auth.providers();
		} catch (e) {
			box.replaceChildren(el("p", reason(e), "err"));
			return;
		}
		const list = document.createElement("ul");
		for (const p of providers) {
			const li = document.createElement("li");
			li.append(el("span", p.name, "name"), el("span", p.configured ? t("configured") : t("unconfigured"), "tag"));
			if (p.label) li.append(el("span", p.label, "tag"));
			if (p.apiKey?.login) li.append(button(t("model.apiKey"), () => void startLogin(p.id, "api_key")));
			if (p.oauth) li.append(button(p.oauth.label || t("model.login"), () => void startLogin(p.id, "oauth")));
			if (p.configured) li.append(button(t("model.logout"), async () => { await cave.auth.logout(p.id); await refreshProvidersAndModels(); }));
			list.append(li);
		}
		box.replaceChildren(list);
	}

	async function refreshProvidersAndModels() {
		settings = await cave.settings();
		refreshCurrent();
		await renderProviders();
		await renderModels();
	}

	async function startLogin(provider, type) {
		$("flow").hidden = false;
		$("notices").replaceChildren();
		$("promptArea").replaceChildren(el("p", t("login.waiting"), "muted"));
		const offPrompt = cave.auth.onPrompt(({ flow, prompt }) => renderPrompt(flow, prompt));
		const offNotice = cave.auth.onNotice(({ notice }) => renderNotice(notice));
		try {
			await cave.auth.login(provider, type);
			$("promptArea").replaceChildren(el("p", t("login.done"), "muted"));
		} catch (e) {
			$("promptArea").replaceChildren(el("p", t("login.failed", { error: reason(e) }), "err"));
		} finally {
			offPrompt();
			offNotice();
			await refreshProvidersAndModels();
		}
	}

	function renderPrompt(flow, prompt) {
		const area = $("promptArea");
		area.replaceChildren(el("p", prompt.message));
		if (prompt.type === "select") {
			for (const option of prompt.options ?? []) area.append(button(`${option.label}${option.description ? ` — ${option.description}` : ""}`, () => answer(flow, option.id)));
			return;
		}
		const input = el("input");
		input.type = prompt.type === "secret" ? "password" : "text";
		input.placeholder = prompt.placeholder ?? "";
		input.addEventListener("keydown", (e) => { if (e.key === "Enter") answer(flow, input.value); });
		const row = el("div", undefined, "row");
		row.append(input, button(t("login.ok"), () => answer(flow, input.value)));
		area.append(row);
		input.focus();
	}

	function answer(flow, value) {
		$("promptArea").replaceChildren(el("p", t("login.waiting"), "muted"));
		void cave.auth.answer(flow, value).catch((e) => $("promptArea").replaceChildren(el("p", reason(e), "err")));
	}

	function renderNotice(notice) {
		const box = $("notices");
		if (notice.type === "info") {
			box.append(el("p", notice.message));
			for (const l of notice.links ?? []) box.append(link(l.url, l.label ?? l.url));
		} else if (notice.type === "auth_url") {
			box.append(link(notice.url, t("login.link")));
			if (notice.instructions) box.append(el("p", notice.instructions, "muted"));
		} else if (notice.type === "device_code") {
			box.append(el("p", t("login.device", { uri: notice.verificationUri, code: notice.userCode })));
		} else if (notice.type === "progress") {
			box.append(el("p", notice.message, "muted"));
		}
	}

	async function renderModels() {
		const list = $("modelList");
		list.replaceChildren(el("li", t("model.loading"), "muted"));
		try {
			allModels = await cave.models();
		} catch (e) {
			list.replaceChildren(el("li", reason(e), "err"));
			return;
		}
		drawModels();
	}

	function drawModels() {
		const query = $("search").value.trim().toLowerCase();
		const current = typeof settings.model === "string" ? settings.model : "";
		const list = $("modelList");
		const rows = allModels.filter((m) => (showAll || m.available) && (query === "" || m.ref.toLowerCase().includes(query) || m.name.toLowerCase().includes(query)));
		list.replaceChildren();
		if (rows.length === 0) {
			list.append(el("li", t("model.empty"), "muted"));
			return;
		}
		for (const m of rows.slice(0, 200)) {
			const li = document.createElement("li");
			li.append(el("span", m.ref === current ? `${m.name} · ${t("current")}` : m.name, "name"));
			if (!m.available) li.append(el("span", t("model.noCredentials"), "tag"));
			li.append(button(t("use"), async () => {
				try {
					settings = await cave.setSettings({ model: m.ref });
					refreshCurrent();
					drawModels();
				} catch (e) {
					alert(reason(e));
				}
			}));
			list.append(li);
		}
	}
})();
})();
</script>
</html>
